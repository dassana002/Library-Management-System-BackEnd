spring.application.name=LostAndFoundApplication
server.servlet.context-path=/LostAndFoundApplication
server.port=8081

#Data source Configs
spring.datasource.url=jdbc:mysql://localhost:3306/LostAndFoundApplication?createDatabaseIfNotExist=true
spring.datasource.password=1234
spring.datasource.username=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


## Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true # Formats SQL queries for better readability