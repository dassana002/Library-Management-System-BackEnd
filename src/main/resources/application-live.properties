spring.application.name=ClassProjectLibraryManagementSoftware
server.port=9999
server.servlet.context-path=/librarySoftware

##Data Source Configs
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=mysql
spring.datasource.url=jdbc:mysql://localhost:3306/LibraryManagemetSystem?createDatabaseIfNotExist=true

## Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true # Formats SQL queries for better readability

# Util
perDayFine = 5.00